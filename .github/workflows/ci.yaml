---
name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          scr_pre=tool/local
          \builtin . ${scr_pre:?}/ubuntu_ci_install.sh

      - name: Run core CI task
        run: |
          scr_pre=tool/local
          \builtin . ${scr_pre:?}/ci_run.sh

